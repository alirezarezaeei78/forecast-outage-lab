name: Causal feature checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-sweep.txt
      - run: python experiment.py --check-only
      - run: python fallback_policy.py --check-only
      - run: python masking_sweep.py --check-only
      - run: python arrival_audit.py --check-only
